[package]
name = "observatory"
version = "1.0.0"
edition = "2024"
authors = ["McKayla Washburn-Love <kayla@tree.camp>"]
license = "MPL-2.0"
publish = false

[[bin]]
name = "observatory"
path = "./main.rs"

[dependencies]
observatory-core = { path = "../core" }
# runtime_shaders: the Metal shaders are compiled when the app starts rather
# than by the build, which would need Xcode's separate Metal Toolchain.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
futures = "0.3"
unicode-segmentation = "1"
anyhow = "1"
# What gpui takes a picture as: the About window's sky is one.
image = { version = "0.25", default-features = false }
smallvec = "1"

# For moving the About window by a press anywhere in it, which gpui leaves
# to AppKit on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
raw-window-handle = "0.6"
