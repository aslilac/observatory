[package]
name = "observatory-core"
version = "1.0.0-beta.5"
edition = "2024"
publish = false

[lib]
path = "./lib.rs"

# Writes a frame of the About window's sky to a file, to look at.
[[example]]
name = "sky"
path = "./examples/sky.rs"

# Says what the updater would find, and checks a download as it would.
[[example]]
name = "update"
path = "./examples/update.rs"

[dependencies]
observatory-scan = { path = "../scanner" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
# Asks the bucket and GitHub what the newest release is, and downloads it.
ureq = "2"

# statfs, for how full a volume is: statvfs there can't count a big one.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# And statvfs, which is right everywhere else.
[target.'cfg(not(target_os = "macos"))'.dependencies]
fs4 = { version = "0.13", default-features = false, features = ["sync"] }
