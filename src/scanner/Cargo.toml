[package]
name = "observatory-scan"
version = "1.0.0"
edition = "2024"
authors = ["McKayla Washburn-Love <kayla@tree.camp>"]
license = "MPL-2.0"
publish = false

[lib]
path = "./lib.rs"

[[bin]]
name = "observatory-scan"
path = "./main.rs"

[dependencies]
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
string-interner = { version = "0.20", default-features = false, features = [
	"backends",
	"inline-more",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
