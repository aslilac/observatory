<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
	<!--
		Observatory app icon — Dome direction.
		Faithful translation of the DomeArt component from the design handoff
		(design_handoff_observatory_classic/source/classic-icon.jsx). 1024x1024
		master, squircle-masked. Tokens: ink #10131a, paper #fafaf8,
		accent #3a6df0, accentDeep #1a2d6b, cream #f1ede2, muted #7c7a72.
	-->
	<defs>
		<!-- macOS squircle path; everything else is clipped to this -->
		<clipPath id="squircle">
			<path d="M512 0 C870 0 1024 154 1024 512 C1024 870 870 1024 512 1024 C154 1024 0 870 0 512 C0 154 154 0 512 0 Z" />
		</clipPath>
		<radialGradient id="domeSky" cx="50%" cy="38%" r="65%">
			<stop offset="0%" stop-color="#3a6df0" stop-opacity="0.18" />
			<stop offset="100%" stop-color="#3a6df0" stop-opacity="0" />
		</radialGradient>
		<linearGradient id="domePanel" x1="0" x2="0" y1="0" y2="1">
			<stop offset="0%" stop-color="#ffffff" />
			<stop offset="100%" stop-color="#e8e3d4" />
		</linearGradient>
		<linearGradient id="domeGround" x1="0" x2="0" y1="0" y2="1">
			<stop offset="0%" stop-color="#bfb6a1" />
			<stop offset="100%" stop-color="#9d9582" />
		</linearGradient>
		<clipPath id="domeArc">
			<path d="M 132 537 A 380 360 0 0 1 892 537 Z" />
		</clipPath>
	</defs>

	<!-- Paper backplate filling the squircle -->
	<path d="M512 0 C870 0 1024 154 1024 512 C1024 870 870 1024 512 1024 C154 1024 0 870 0 512 C0 154 154 0 512 0 Z" fill="#fafaf8" />

	<!-- Everything below is clipped to the squircle -->
	<g clip-path="url(#squircle)">
		<!-- Sky vignette -->
		<rect x="0" y="0" width="1024" height="1024" fill="url(#domeSky)" />

		<!-- Background stars -->
		<circle cx="120" cy="197" r="4" fill="#1a2d6b" opacity="0.35" />
		<circle cx="200" cy="287" r="3" fill="#1a2d6b" opacity="0.35" />
		<circle cx="880" cy="237" r="5" fill="#1a2d6b" opacity="0.35" />
		<circle cx="820" cy="377" r="3" fill="#1a2d6b" opacity="0.35" />
		<circle cx="80" cy="437" r="3" fill="#1a2d6b" opacity="0.35" />
		<circle cx="940" cy="497" r="4" fill="#1a2d6b" opacity="0.35" />
		<circle cx="160" cy="657" r="3" fill="#1a2d6b" opacity="0.35" />
		<circle cx="900" cy="657" r="3" fill="#1a2d6b" opacity="0.35" />

		<!-- Ground band -->
		<rect x="0" y="737" width="1024" height="287" fill="url(#domeGround)" />
		<!-- Horizon line + base shadow ellipse -->
		<rect x="0" y="737" width="1024" height="6" fill="#10131a" opacity="0.18" />
		<ellipse cx="512" cy="751" rx="420" ry="14" fill="#10131a" opacity="0.18" />

		<!-- Ground tufts -->
		<line x1="180" y1="759" x2="188" y2="755" stroke="#10131a" stroke-width="1.5" opacity="0.25" />
		<line x1="280" y1="777" x2="288" y2="773" stroke="#10131a" stroke-width="1.5" opacity="0.25" />
		<line x1="760" y1="759" x2="768" y2="755" stroke="#10131a" stroke-width="1.5" opacity="0.25" />
		<line x1="860" y1="777" x2="868" y2="773" stroke="#10131a" stroke-width="1.5" opacity="0.25" />
		<line x1="940" y1="759" x2="948" y2="755" stroke="#10131a" stroke-width="1.5" opacity="0.25" />
		<line x1="90" y1="777" x2="98" y2="773" stroke="#10131a" stroke-width="1.5" opacity="0.25" />

		<!-- Base building -->
		<rect x="132" y="537" width="760" height="200" fill="#f1ede2" />
		<!-- Brick lines -->
		<line x1="132" y1="577" x2="892" y2="577" stroke="#7c7a72" stroke-width="1.5" opacity="0.18" />
		<line x1="132" y1="617" x2="892" y2="617" stroke="#7c7a72" stroke-width="1.5" opacity="0.18" />
		<line x1="132" y1="657" x2="892" y2="657" stroke="#7c7a72" stroke-width="1.5" opacity="0.18" />
		<line x1="132" y1="697" x2="892" y2="697" stroke="#7c7a72" stroke-width="1.5" opacity="0.18" />
		<!-- Base top trim -->
		<rect x="124" y="527" width="776" height="20" fill="#10131a" />
		<!-- Shadow under dome -->
		<rect x="132" y="537" width="760" height="14" fill="#10131a" opacity="0.15" />

		<!-- Dome body -->
		<path d="M 132 537 A 380 360 0 0 1 892 537 Z" fill="url(#domePanel)" />

		<!-- Ribs and latitude rings (clipped to the dome arc) -->
		<g clip-path="url(#domeArc)">
			<!-- Longitudinal ribs -->
			<line x1="512" y1="177" x2="382" y2="537" stroke="#7c7a72" stroke-width="1.5" opacity="0.25" />
			<line x1="512" y1="177" x2="221" y2="537" stroke="#7c7a72" stroke-width="1.5" opacity="0.45" />
			<line x1="512" y1="177" x2="133" y2="537" stroke="#7c7a72" stroke-width="2.2" opacity="0.45" />
			<line x1="512" y1="177" x2="201" y2="537" stroke="#7c7a72" stroke-width="2.2" opacity="0.45" />
			<line x1="512" y1="177" x2="395" y2="537" stroke="#7c7a72" stroke-width="2.2" opacity="0.45" />
			<line x1="512" y1="177" x2="629" y2="537" stroke="#7c7a72" stroke-width="2.2" opacity="0.45" />
			<line x1="512" y1="177" x2="823" y2="537" stroke="#7c7a72" stroke-width="2.2" opacity="0.45" />
			<line x1="512" y1="177" x2="891" y2="537" stroke="#7c7a72" stroke-width="2.2" opacity="0.45" />
			<line x1="512" y1="177" x2="803" y2="537" stroke="#7c7a72" stroke-width="1.5" opacity="0.45" />
			<line x1="512" y1="177" x2="642" y2="537" stroke="#7c7a72" stroke-width="1.5" opacity="0.25" />
			<!-- Latitude rings -->
			<ellipse cx="512" cy="413.5" rx="133" ry="22.7" fill="none" stroke="#7c7a72" stroke-width="1.5" opacity="0.22" />
			<ellipse cx="512" cy="325.3" rx="228" ry="38.9" fill="none" stroke="#7c7a72" stroke-width="1.5" opacity="0.22" />
			<ellipse cx="512" cy="247.7" rx="311.6" ry="53.1" fill="none" stroke="#7c7a72" stroke-width="1.5" opacity="0.22" />
		</g>

		<!-- Dome outline -->
		<path d="M 132 537 A 380 360 0 0 1 892 537" fill="none" stroke="#10131a" stroke-width="6" />

		<!-- Slit: night sky behind, accent glow, ink frame -->
		<path d="M 468 195 Q 512 163 556 195 L 556 537 L 468 537 Z" fill="#1a2d6b" />
		<path d="M 484 203 Q 512 181 540 203 L 540 531 L 484 531 Z" fill="#3a6df0" opacity="0.85" />
		<path d="M 468 195 Q 512 163 556 195" fill="none" stroke="#10131a" stroke-width="4" />
		<line x1="468" y1="195" x2="468" y2="537" stroke="#10131a" stroke-width="3" />
		<line x1="556" y1="195" x2="556" y2="537" stroke="#10131a" stroke-width="3" />

		<!-- Stars inside the slit -->
		<circle cx="506" cy="257" r="9" fill="#fafaf8" />
		<circle cx="528" cy="337" r="5" fill="#fafaf8" opacity="0.85" />
		<circle cx="498" cy="397" r="3" fill="#fafaf8" opacity="0.7" />
		<line x1="506" y1="241" x2="506" y2="273" stroke="#fafaf8" stroke-width="1.5" opacity="0.7" />
		<line x1="490" y1="257" x2="522" y2="257" stroke="#fafaf8" stroke-width="1.5" opacity="0.7" />

		<!-- Door (arched top) -->
		<path d="M 468 737 L 468 617 A 44 44 0 0 1 556 617 L 556 737 Z" fill="#10131a" />
		<circle cx="534" cy="681" r="3.5" fill="#f1ede2" />

		<!-- Left window -->
		<rect x="330" y="607" width="44" height="56" rx="6" fill="#10131a" />
		<line x1="352" y1="613" x2="352" y2="657" stroke="#f1ede2" stroke-width="2" opacity="0.6" />
		<line x1="334" y1="635" x2="370" y2="635" stroke="#f1ede2" stroke-width="2" opacity="0.6" />

		<!-- Right window -->
		<rect x="650" y="607" width="44" height="56" rx="6" fill="#10131a" />
		<line x1="672" y1="613" x2="672" y2="657" stroke="#f1ede2" stroke-width="2" opacity="0.6" />
		<line x1="654" y1="635" x2="690" y2="635" stroke="#f1ede2" stroke-width="2" opacity="0.6" />

		<!-- Bottom plinth -->
		<rect x="116" y="725" width="792" height="14" fill="#10131a" opacity="0.85" />
	</g>

	<!-- Squircle outline (subtle) -->
	<path d="M512 0 C870 0 1024 154 1024 512 C1024 870 870 1024 512 1024 C154 1024 0 870 0 512 C0 154 154 0 512 0 Z" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="2" />
</svg>
