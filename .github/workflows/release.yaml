name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest

    name: Version

    outputs:
      version: ${{ steps.verify.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        name: Checkout

      # The builds are named after the app's version, which is the desktop
      # crate's.
      - run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' src/desktop/Cargo.toml | head -1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in src/desktop/Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
        id: verify
        name: Verify version

  # Observatory.app in a .dmg to install from, and in a .zip for the app to
  # update itself from. Apple silicon only.
  macos:
    runs-on: macos-latest

    name: Package.darwin-arm64

    needs:
      - version

    # With these, the build is signed with a Developer ID and notarized
    # (see macos/build.sh), which it has to be to update itself. Without,
    # it's signed ad hoc, and only says when there's a new version.
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v7
        name: Checkout

      - uses: apple-actions/import-codesign-certs@v7
        name: Import Developer ID
        if: env.APPLE_TEAM_ID != ''
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - uses: dtolnay/rust-toolchain@stable
        name: Configure Rust

      # So the build compiles gpui's shaders, rather than the app each time
      # it starts. Newer Xcodes keep the compiler apart; older ones have it
      # already, and nothing by this name to download.
      - run: xcodebuild -downloadComponent MetalToolchain || true
        name: Metal toolchain

      - run: macos/build.sh
        name: Package

      - uses: actions/upload-artifact@v7
        name: Upload
        with:
          name: package-darwin-arm64
          path: |
            target/macos/*.dmg
            target/macos/*.zip
          if-no-files-found: error

  # The portable build: the program by itself, in a zip, with its icon in it
  # (src/desktop/build.rs). And beside it the package, an MSIX, for people
  # to download and install (windows/build.ps1). The Store's package is
  # still to come, and will be another again.
  windows:
    strategy:
      fail-fast: false
      matrix:
        release:
          - os: windows-latest
            target: win32-x64

          - os: windows-11-arm
            target: win32-arm64

    name: Package.${{ matrix.release.target }}

    runs-on: ${{ matrix.release.os }}

    needs:
      - version

    # The certificate the package is signed with: a .pfx in base64, and its
    # password. Windows only installs a package signed by someone the PC
    # trusts, so without these there's no package, only the zip.
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - uses: actions/checkout@v7
        name: Checkout

      - uses: dtolnay/rust-toolchain@stable
        name: Configure Rust

      - run: cargo build --release -p observatory
        name: Build

      - run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/observatory.exe out/Observatory.exe
          Compress-Archive -Path out/Observatory.exe `
            -DestinationPath "Observatory-${{ matrix.release.target }}-${{ needs.version.outputs.version }}.zip"
        name: Package

      # A release goes out without the package if it can't be made: the zip
      # is still the app.
      - run: |
          ./windows/build.ps1
          Copy-Item target/windows/*.msix .
        if: env.WINDOWS_CERTIFICATE != ''
        continue-on-error: true
        name: Package (MSIX)

      - uses: actions/upload-artifact@v7
        name: Upload
        with:
          name: package-${{ matrix.release.target }}
          path: |
            *.zip
            *.msix
          if-no-files-found: error

  # The program by itself, in a zip, for anywhere the Flatpak isn't wanted.
  # It isn't static, and can't be: it draws with the GPU, whose driver is
  # the system's own and loaded when it runs. So it's built on the oldest
  # Ubuntu there is to build on, to ask for no newer a C library than it
  # has to, and expects what a desktop has anyway (Wayland or X11,
  # xkbcommon, fontconfig, Vulkan).
  linux:
    strategy:
      fail-fast: false
      matrix:
        release:
          - os: ubuntu-22.04
            target: linux-x64

          - os: ubuntu-22.04-arm
            target: linux-arm64

    name: Package.${{ matrix.release.target }}

    runs-on: ${{ matrix.release.os }}

    needs:
      - version

    steps:
      - uses: actions/checkout@v7
        name: Checkout

      - uses: dtolnay/rust-toolchain@stable
        name: Configure Rust

      - run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig1-dev libfreetype-dev libvulkan-dev
        name: Install

      - run: cargo build --release --locked -p observatory
        name: Build

      # With zip rather than an action, which keeps it a program that can
      # be run.
      - run: |
          mkdir out
          cp target/release/observatory out/observatory
          cd out
          zip "../Observatory-${{ matrix.release.target }}-${{ needs.version.outputs.version }}.zip" observatory
        name: Package

      - uses: actions/upload-artifact@v7
        name: Upload
        with:
          name: package-${{ matrix.release.target }}
          path: "*.zip"
          if-no-files-found: error

  flatpak:
    strategy:
      fail-fast: false
      matrix:
        release:
          - os: ubuntu-latest
            arch: x86_64
            target: linux-x64

          - os: ubuntu-24.04-arm
            arch: aarch64
            target: linux-arm64

    name: Flatpak.${{ matrix.release.target }}

    runs-on: ${{ matrix.release.os }}

    needs:
      - version

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged

    steps:
      - uses: actions/checkout@v7
        name: Checkout

      # The build's copy of the checkout leaves .git out, so the commit
      # (for the about window and bug reports) goes in .commit, where
      # src/desktop/build.rs looks. It's from Actions rather than git, which
      # won't read a checkout the container's user doesn't own.
      - name: Commit
        run: echo "$GITHUB_SHA" > .commit

      # The manifest builds the checkout around it, so flatpak-builder's own
      # directories go where its skip list leaves them out. Releases start
      # from scratch, without a cache.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        name: Build
        with:
          manifest-path: flatpak/ooo.lilac.observatory.yml
          arch: ${{ matrix.release.arch }}
          bundle: Observatory-${{ matrix.release.target }}-${{ needs.version.outputs.version }}.flatpak
          artifact-name: flatpak-${{ matrix.release.target }}
          state-dir: flatpak/.flatpak-builder
          build-dir: flatpak/build
          repo-dir: flatpak/repo
          cache: false

  publish:
    runs-on: ubuntu-latest

    name: Publish

    needs:
      - version
      - macos
      - windows
      - linux
      - flatpak

    permissions:
      contents: write

    # The bucket releases.mckayla.dev serves, over its S3 API.
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.RELEASES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASES_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.RELEASES_REGION || 'us-east-1' }}
      RELEASES_BUCKET: ${{ vars.RELEASES_BUCKET }}
      RELEASES_ENDPOINT: ${{ vars.RELEASES_ENDPOINT }}

    steps:
      - uses: actions/download-artifact@v8
        name: Download
        with:
          path: dist
          merge-multiple: true

      # The app looks here too, when it can't reach the bucket: the Mac zip
      # is found by its name (see src/core/updates.rs).
      - uses: softprops/action-gh-release@v3
        name: Release
        with:
          files: |
            dist/**/*.dmg
            dist/**/*.zip
            dist/**/*.flatpak
          fail_on_unmatched_files: true
          generate_release_notes: true

      # The Windows packages, which a release has only when there was a
      # certificate to sign them with.
      - uses: softprops/action-gh-release@v3
        name: Release (MSIX)
        if: hashFiles('dist/**/*.msix') != ''
        with:
          files: dist/**/*.msix

      # What the app updates from (see src/core/updates.rs): the Mac app's
      # zip and the Windows packages, and latest.json, which names the newest
      # version, its page, and where those are. The builds go up first, and
      # what points at them last, so an app never finds a version that isn't
      # there yet. latest.json is never cached, and the builds are cached
      # for good, since a version's never rebuilt.
      - run: |
          version='${{ needs.version.outputs.version }}'
          base="https://releases.mckayla.dev/observatory"
          s3="s3://$RELEASES_BUCKET/observatory"
          zip="Observatory-darwin-arm64-$version.zip"

          aws s3 cp --endpoint-url "$RELEASES_ENDPOINT" --acl public-read \
            "$(find dist -name "$zip" | head -1)" "$s3/darwin/arm64/$zip" \
            --cache-control 'public, max-age=31536000, immutable'
          downloads="$(jq -n --arg zip "$base/darwin/arm64/$zip" '{"darwin-arm64": $zip}')"

          for arch in x64 arm64; do
            msix="Observatory-win32-$arch-$version.msix"
            built="$(find dist -name "$msix" | head -1)"
            [ -n "$built" ] || continue
            aws s3 cp --endpoint-url "$RELEASES_ENDPOINT" --acl public-read \
              "$built" "$s3/win32/$arch/$msix" \
              --cache-control 'public, max-age=31536000, immutable'
            downloads="$(jq --arg platform "win32-$arch" --arg msix "$base/win32/$arch/$msix" \
              '. + {($platform): $msix}' <<< "$downloads")"
          done

          jq -n --arg version "$version" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/tag/v$version" \
            --argjson downloads "$downloads" \
            '{version: $version, url: $url, downloads: $downloads}' > latest.json
          aws s3 cp --endpoint-url "$RELEASES_ENDPOINT" --acl public-read \
            latest.json "$s3/latest.json" --cache-control no-cache
        if: env.RELEASES_BUCKET != ''
        name: Feed
