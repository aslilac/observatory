name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest

    name: Version

    outputs:
      version: ${{ steps.verify.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        name: Checkout

      # Forge names the builds after the version in package.json.
      - run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in package.json"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
        id: verify
        name: Verify version

  package:
    strategy:
      fail-fast: false
      matrix:
        release:
          - os: macos-latest
            target: darwin-arm64

          - os: ubuntu-latest
            target: linux-x64

          - os: ubuntu-24.04-arm
            target: linux-arm64

          - os: windows-latest
            target: win32-x64

          - os: windows-11-arm
            target: win32-arm64

    name: Package.${{ matrix.release.target }}

    runs-on: ${{ matrix.release.os }}

    needs:
      - version

    # With these, the Mac build is signed with a Developer ID and notarized
    # (see forge.config.js), which it has to be to update itself. Without,
    # it's signed ad hoc, and only says when there's a new version.
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v7
        name: Checkout

      - uses: apple-actions/import-codesign-certs@v7
        name: Import Developer ID
        if: runner.os == 'macOS' && env.APPLE_TEAM_ID != ''
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - uses: dtolnay/rust-toolchain@stable
        name: Configure Rust

      - uses: pnpm/action-setup@v6
        name: Configure pnpm
        with:
          version: 12.12.0

      - uses: actions/setup-node@v7
        name: Configure Node
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        name: Install

      - run: node scripts/build-native.mjs
        name: Build scanner

      - run: pnpm exec electron-vite build
        name: Build

      # A zip everywhere, and a Squirrel installer on Windows.
      - run: pnpm exec electron-forge make
        name: Package

      # On Windows, also what Squirrel updates from: its list of packages,
      # and the package on it.
      - uses: actions/upload-artifact@v7
        name: Upload
        with:
          name: package-${{ matrix.release.target }}
          path: |
            out/make/zip/**/*.zip
            out/make/squirrel.windows/**/*.exe
            out/make/squirrel.windows/**/RELEASES
            out/make/squirrel.windows/**/*.nupkg
          if-no-files-found: error

  flatpak:
    strategy:
      fail-fast: false
      matrix:
        release:
          - os: ubuntu-latest
            arch: x86_64
            target: linux-x64

          - os: ubuntu-24.04-arm
            arch: aarch64
            target: linux-arm64

    name: Flatpak.${{ matrix.release.target }}

    runs-on: ${{ matrix.release.os }}

    needs:
      - version

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged

    steps:
      - uses: actions/checkout@v7
        name: Checkout

      # The manifest builds the checkout around it, so flatpak-builder's own
      # directories go where its skip list leaves them out. Releases start
      # from scratch, without a cache.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        name: Build
        with:
          manifest-path: flatpak/ooo.lilac.observatory.yml
          arch: ${{ matrix.release.arch }}
          bundle: Observatory-${{ matrix.release.target }}-${{ needs.version.outputs.version }}.flatpak
          artifact-name: flatpak-${{ matrix.release.target }}
          state-dir: flatpak/.flatpak-builder
          build-dir: flatpak/build
          repo-dir: flatpak/repo
          cache: false

  publish:
    runs-on: ubuntu-latest

    name: Publish

    needs:
      - version
      - package
      - flatpak

    permissions:
      contents: write

    # The bucket releases.mckayla.dev serves, over its S3 API.
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.RELEASES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASES_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.RELEASES_REGION || 'us-east-1' }}
      RELEASES_BUCKET: ${{ vars.RELEASES_BUCKET }}
      RELEASES_ENDPOINT: ${{ vars.RELEASES_ENDPOINT }}

    steps:
      - uses: actions/download-artifact@v8
        name: Download
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        name: Release
        with:
          files: |
            dist/**/*.zip
            dist/**/*.exe
            dist/**/*.flatpak
          fail_on_unmatched_files: true
          generate_release_notes: true

      # What the app updates from (see src/main/updates.ts): each Mac zip
      # with a manifest for Squirrel.Mac, each Windows arch's Squirrel
      # package and list, and latest.json for everywhere else. The builds go
      # up first, and what points at them last, so an app never finds a
      # version that isn't there yet. Those few are never cached, and the
      # builds are cached for good, since a version's never rebuilt.
      - run: |
          version='${{ needs.version.outputs.version }}'
          base="https://releases.mckayla.dev/observatory"
          put() {
            aws s3 cp --endpoint-url "$RELEASES_ENDPOINT" --acl public-read \
              "$@" --cache-control 'public, max-age=31536000, immutable'
          }
          point() {
            aws s3 cp --endpoint-url "$RELEASES_ENDPOINT" --acl public-read \
              "$@" --cache-control no-cache
          }
          s3="s3://$RELEASES_BUCKET/observatory"
          manifests="$(mktemp -d)"

          for zip in $(find dist -path '*/zip/darwin/*' -name '*.zip'); do
            arch="$(basename "$(dirname "$zip")")"
            name="$(basename "$zip")"
            put "$zip" "$s3/darwin/$arch/$name"
            mkdir -p "$manifests/darwin/$arch"
            jq -n --arg version "$version" --arg url "$base/darwin/$arch/$name" \
              --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{currentRelease: $version, releases: [{version: $version, updateTo: {
                version: $version, name: "Observatory \($version)",
                pub_date: $date, notes: "", url: $url}}]}' \
              > "$manifests/darwin/$arch/RELEASES.json"
          done

          for list in $(find dist -path '*/squirrel.windows/*' -name RELEASES); do
            dir="$(dirname "$list")"
            arch="$(basename "$dir")"
            for nupkg in "$dir"/*.nupkg; do
              put "$nupkg" "$s3/win32/$arch/$(basename "$nupkg")"
            done
            mkdir -p "$manifests/win32/$arch"
            cp "$list" "$manifests/win32/$arch/RELEASES"
          done

          jq -n --arg version "$version" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/tag/v$version" \
            '{version: $version, url: $url}' > "$manifests/latest.json"
          point "$manifests" "$s3" --recursive
        if: env.RELEASES_BUCKET != ''
        name: Feed
