name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest

    name: Version

    outputs:
      version: ${{ steps.verify.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        name: Checkout

      # Forge names the builds after the version in package.json.
      - run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in package.json"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
        id: verify
        name: Verify version

  package:
    strategy:
      fail-fast: false
      matrix:
        release:
          - os: macos-latest
            target: darwin-arm64

          - os: ubuntu-latest
            target: linux-x64

          - os: ubuntu-24.04-arm
            target: linux-arm64

          - os: windows-latest
            target: win32-x64

    name: Package.${{ matrix.release.target }}

    runs-on: ${{ matrix.release.os }}

    needs:
      - version

    # With these, the Mac build is signed with a Developer ID and notarized
    # (see forge.config.js), which it has to be to update itself. Without,
    # it's signed ad hoc, and only says when there's a new version.
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v7
        name: Checkout

      - uses: apple-actions/import-codesign-certs@v7
        name: Import Developer ID
        if: runner.os == 'macOS' && env.APPLE_TEAM_ID != ''
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - uses: dtolnay/rust-toolchain@stable
        name: Configure Rust

      - uses: pnpm/action-setup@v6
        name: Configure pnpm
        with:
          version: 12.12.0

      - uses: actions/setup-node@v7
        name: Configure Node
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        name: Install

      - run: node scripts/build-native.mjs
        name: Build scanner

      - run: pnpm exec electron-vite build
        name: Build

      # A zip everywhere, and a Squirrel installer on Windows.
      - run: pnpm exec electron-forge make
        name: Package

      # On Windows, also what Squirrel updates from, through
      # update.electronjs.org: the list of packages, x64's, since the
      # service takes a release's one for every arch (see
      # src/main/updates.ts), and the package on it.
      - uses: actions/upload-artifact@v7
        name: Upload
        with:
          name: package-${{ matrix.release.target }}
          path: |
            out/make/zip/**/*.zip
            out/make/squirrel.windows/**/*.exe
            out/make/squirrel.windows/x64/RELEASES
            out/make/squirrel.windows/x64/*.nupkg
          if-no-files-found: error

  flatpak:
    strategy:
      fail-fast: false
      matrix:
        release:
          - os: ubuntu-latest
            arch: x86_64
            target: linux-x64

          - os: ubuntu-24.04-arm
            arch: aarch64
            target: linux-arm64

    name: Flatpak.${{ matrix.release.target }}

    runs-on: ${{ matrix.release.os }}

    needs:
      - version

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged

    steps:
      - uses: actions/checkout@v7
        name: Checkout

      # The manifest builds the checkout around it, so flatpak-builder's own
      # directories go where its skip list leaves them out. Releases start
      # from scratch, without a cache.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        name: Build
        with:
          manifest-path: flatpak/ooo.lilac.observatory.yml
          arch: ${{ matrix.release.arch }}
          bundle: Observatory-${{ matrix.release.target }}-${{ needs.version.outputs.version }}.flatpak
          artifact-name: flatpak-${{ matrix.release.target }}
          state-dir: flatpak/.flatpak-builder
          build-dir: flatpak/build
          repo-dir: flatpak/repo
          cache: false

  publish:
    runs-on: ubuntu-latest

    name: Publish

    needs:
      - package
      - flatpak

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        name: Download
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        name: Release
        with:
          files: |
            dist/**/*.zip
            dist/**/*.exe
            dist/**/RELEASES
            dist/**/*.nupkg
            dist/**/*.flatpak
          fail_on_unmatched_files: true
          generate_release_notes: true
