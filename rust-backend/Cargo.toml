[package]
name = "observatory-scan"
version = "0.1.0"
edition = "2021"
authors = ["McKayla Washburn <mckayla@hey.com>"]
license = "MIT"
publish = false

[lib]
path = "./lib.rs"

[[bin]]
name = "observatory-scan"
path = "./main.rs"

[dependencies]
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
